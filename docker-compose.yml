services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oco_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oco_cms"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_URL: http://localhost:8081
      FRONTEND_URL: http://localhost:8081
      PUBLIC_ROOT: /app/public
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/oco_cms?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:?DEFAULT_ADMIN_EMAIL is required}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD is required}
      PRIVATE_PAGE_DEFAULT_USERNAME: ${PRIVATE_PAGE_DEFAULT_USERNAME:?PRIVATE_PAGE_DEFAULT_USERNAME is required}
      PRIVATE_PAGE_DEFAULT_PASSWORD: ${PRIVATE_PAGE_DEFAULT_PASSWORD:?PRIVATE_PAGE_DEFAULT_PASSWORD is required}
      COOKIE_DOMAIN: localhost
    # Apply committed migrations only. Seeding is a deliberate manual step
    # (`npm run prisma:seed`), never run automatically on `up`.
    command: ["sh", "-c", "npm run prisma:deploy"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_URL: http://localhost:8081
      FRONTEND_URL: http://localhost:8081
      PUBLIC_ROOT: /app/public
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/oco_cms?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:?DEFAULT_ADMIN_EMAIL is required}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD is required}
      PRIVATE_PAGE_DEFAULT_USERNAME: ${PRIVATE_PAGE_DEFAULT_USERNAME:?PRIVATE_PAGE_DEFAULT_USERNAME is required}
      PRIVATE_PAGE_DEFAULT_PASSWORD: ${PRIVATE_PAGE_DEFAULT_PASSWORD:?PRIVATE_PAGE_DEFAULT_PASSWORD is required}
      COOKIE_DOMAIN: localhost
      MEDIA_BASE_URL: http://localhost:8081/uploads
    # Not published to the host: the API/admin is reachable only through nginx
    # (frontend) over the internal compose network via the `backend` service name.
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - backend_uploads:/app/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  postgres_data:
  backend_uploads:
